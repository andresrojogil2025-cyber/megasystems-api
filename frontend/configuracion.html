<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megasystems - Configuración</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .page-header h2 { color: var(--color-text-main); }
        .btn-back { display: flex; align-items: center; gap: 8px; color: var(--color-primary); text-decoration: none; font-weight: 500; }
        
        .panel { background: var(--color-surface); padding: 30px; border-radius: var(--border-radius-lg); box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 800px; margin: auto; }
        .panel h3 { margin-bottom: 25px; color: var(--color-text-main); border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; display: flex; align-items: center; gap: 10px;}

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--color-text-main); font-weight: 600; font-size: 0.95rem;}
        .form-group input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: var(--border-radius-sm); font-family: 'Inter'; outline: none; }
        .form-group input:focus { border-color: var(--color-primary); }
        
        .preview-box { margin-top: 10px; width: 100%; border-radius: var(--border-radius-sm); overflow: hidden; border: 1px solid #e5e7eb; background: #f9fafb; display: flex; justify-content: center; align-items: center;}
        .preview-box.logo-prev { height: 100px; padding: 20px;}
        .preview-box.banner-prev { height: 150px; }
        .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .btn-save { width: 100%; padding: 15px; background: var(--color-secondary); color: white; border: none; border-radius: var(--border-radius-sm); font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: all 0.3s;}
        .btn-save:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);}
    </style>
</head>
<body style="background: var(--color-bg-light); padding: 30px;">
    
    <div class="page-header" style="max-width: 800px; margin: 0 auto 25px;">
        <a href="dashboard.html" class="btn-back"><i class="ph ph-arrow-left"></i> Volver al Dashboard</a>
        <h2>Gestor Visual Dinámico</h2>
    </div>

    <div class="panel">
        <h3><i class="ph ph-image"></i> Personalizar Apariencia</h3>
        <p style="color: var(--color-text-muted); margin-bottom: 25px; font-size:0.9rem;">
            Actualice las URLs de las imágenes para personalizar la plataforma. Los cambios se aplicarán instantáneamente para todos los usuarios.
        </p>
        
        <form id="configForm">
            <!-- Logo -->
            <div class="form-group">
                <label>Logo de la Empresa</label>
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <input type="text" id="logo_url" placeholder="images/default/logo.png" required style="flex:1;">
                    <input type="file" id="file_logo" style="display:none;" accept="image/*">
                    <button type="button" class="btn-back" style="padding:0 15px; border:1px solid var(--color-primary); border-radius:4px; font-size:0.8rem;" onclick="document.getElementById('file_logo').click()">
                        <i class="ph ph-upload-simple"></i> Subir
                    </button>
                </div>
                <div class="preview-box logo-prev">
                    <img id="logo_preview" src="" alt="Vista previa del Logo">
                </div>
            </div>

            <!-- Banner -->
            <div class="form-group">
                <label>Banner del Dashboard</label>
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <input type="text" id="banner_url" placeholder="images/default/banner.jpg" required style="flex:1;">
                    <input type="file" id="file_banner" style="display:none;" accept="image/*">
                    <button type="button" class="btn-back" style="padding:0 15px; border:1px solid var(--color-primary); border-radius:4px; font-size:0.8rem;" onclick="document.getElementById('file_banner').click()">
                        <i class="ph ph-upload-simple"></i> Subir
                    </button>
                </div>
                <div class="preview-box banner-prev">
                    <img id="banner_preview" src="" style="width:100%; height:100%; object-fit:cover;" alt="Vista previa del Banner">
                </div>
            </div>

            <!-- Fondo Login -->
            <div class="form-group">
                <label>Fondo de Pantalla - Login</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="fondo_login_url" placeholder="images/default/fondo.jpg" required style="flex:1;">
                    <input type="file" id="file_fondo" style="display:none;" accept="image/*">
                    <button type="button" class="btn-back" style="padding:0 15px; border:1px solid var(--color-primary); border-radius:4px; font-size:0.8rem;" onclick="document.getElementById('file_fondo').click()">
                        <i class="ph ph-upload-simple"></i> Subir
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-save"><i class="ph ph-floppy-disk"></i> Guardar Configuración</button>
        </form>
    </div>

    <script src="configuracion.js"></script>
</body>
</html>
